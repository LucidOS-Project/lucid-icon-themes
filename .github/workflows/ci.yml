name: CI

# This repository had no CI and its .deb had never been built -- not once. Two
# defects that only a build would have shown were live at the same time:
# debian/install globbed Lucid-Light*, which had been renamed and so matched
# nothing, and the package would have shipped 45 MB of macOS metadata because
# dh_install copies whole directories.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      # build-essential is an implicit build dependency of every Debian source
      # package, so dpkg-checkbuilddeps demands it even though this one compiles
      # nothing. It is present on a development machine and not on a runner.
      # gir1.2-gtk-4.0 is for the lookup check, which resolves icons the way a
      # desktop does. It needs no display.
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential dpkg-dev debhelper fakeroot \
            python3 python3-gi gir1.2-glib-2.0 gir1.2-gtk-4.0 \
            gtk-update-icon-cache

      # The tree, before anything packages it. debian/rules runs this too, so a
      # package build fails on the same conditions -- this step is here so the
      # failure is legible when it is the tree that is wrong rather than the
      # packaging.
      - name: The themes must parse and their directories must exist
        run: python3 tests/check_themes.py .

      - name: Build the package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          # Both binary packages, and everything dpkg-buildpackage wrote beside
          # them. Naming one package here is how the split's first CI run
          # failed: the build produced two .debs and the move collected one.
          mv ../lucidos-icon-themes_* ../lucid-everything-icon-theme_* dist/ 2>/dev/null || true
          ls -la dist
          test -f dist/lucidos-icon-themes_*.deb 2>/dev/null \
            || { echo "lucidos-icon-themes .deb was not produced"; exit 1; }
          ls dist/lucid-everything-icon-theme_*.deb >/dev/null \
            || { echo "lucid-everything-icon-theme .deb was not produced"; exit 1; }

      - name: Each package must contain its own licence's files and no others
        run: |
          own=$(ls dist/lucidos-icon-themes_*.deb)
          everything=$(ls dist/lucid-everything-icon-theme_*.deb)
          dpkg-deb -I "$own"; dpkg-deb -I "$everything"

          has() { dpkg-deb -c "$1" | grep -q " ./usr/share/icons/$2/index.theme\$"; }

          # debian/install once read "Lucid-Light* /usr/share/icons/". Lucid-Light
          # had been renamed to Lucid, so the glob matched nothing: the build
          # succeeded and the package installed no icons at all.
          has "$own" Lucid            || { echo "Lucid is not in lucidos-icon-themes"; exit 1; }
          has "$own" Lucid-Dark       || { echo "Lucid-Dark is not in lucidos-icon-themes"; exit 1; }
          has "$everything" Lucid-Everything \
            || { echo "Lucid-Everything is not in lucid-everything-icon-theme"; exit 1; }

          # The licence boundary, as something dpkg enforces. Lucid-Everything is
          # GPL-3.0 and the rest is CC-BY-NC-SA; the GPL does not permit adding
          # restrictions to what it covers, so the two must not share a package.
          has "$own" Lucid-Everything \
            && { echo "GPL-3.0 theme inside the CC-BY-NC-SA package"; exit 1; }
          has "$everything" Lucid \
            && { echo "CC-BY-NC-SA theme inside the GPL-3.0 package"; exit 1; }

          # Lucid inherits Lucid-Everything, so this is a dependency and not a
          # recommendation: without it every third-party icon falls to hicolor.
          dpkg-deb -f "$own" Depends | grep -q 'lucid-everything-icon-theme' \
            || { echo "lucidos-icon-themes does not depend on the theme it inherits"; exit 1; }

          icons=$(dpkg-deb -c "$own" | grep -cE '\.(svg|png|xpm)$')
          icons=$((icons + $(dpkg-deb -c "$everything" | grep -cE '\.(svg|png|xpm)$')))
          echo "$icons icon files across both packages"
          [ "$icons" -gt 20000 ] \
            || { echo "far too few icons -- did the install files match anything?"; exit 1; }

          # dh_install copies whole directories, so anything left in the working
          # tree ships. These assets have passed through a Mac.
          for deb in "$own" "$everything"; do
            junk=$(dpkg-deb -c "$deb" | grep -cE '/\._|/\.DS_Store$' || true)
            [ "$junk" -eq 0 ] || { echo "$junk macOS metadata files in $deb"; exit 1; }
          done

      # Installed for real, then asked the question a desktop asks. This is the
      # regression test for the inherit chain: Lucid covers about a hundred
      # applications and inherits Lucid-Everything for the rest, so if Inherits=
      # stops being readable every third-party icon silently falls to hicolor
      # and nothing reports an error.
      - name: Install both, then resolve icons through them
        run: |
          sudo apt-get install -y ./dist/lucid-everything-icon-theme_*.deb \
                                  ./dist/lucidos-icon-themes_*.deb
          for t in Lucid Lucid-Dark Lucid-Everything; do
            test -f "/usr/share/icons/$t/index.theme" || { echo "$t did not install"; exit 1; }
          done
          sudo gtk-update-icon-cache -f -t /usr/share/icons/Lucid
          sudo gtk-update-icon-cache -f -t /usr/share/icons/Lucid-Dark
          python3 tests/check_lookup.py /usr/share/icons

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: lucidos-icon-themes-deb
          path: dist/
          if-no-files-found: error
